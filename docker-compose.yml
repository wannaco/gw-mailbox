# =============================================================================
# gw-mailbox — single-VPS deployment (app + automatic HTTPS)
#
#   cp .env.example .env      # then edit DOMAIN + MAILBOX_PUBLIC_URL
#   docker compose up -d
#
# Pulls the published image — no toolchain, no build step. Caddy obtains and
# renews a Let's Encrypt certificate for $DOMAIN and proxies to PocketBase. The
# app container needs no TLS config and the image is domain-agnostic (the SPA is
# same-origin; the public URL is read at runtime from MAILBOX_PUBLIC_URL), so the
# same image runs on any host.
#
# To build from source instead, see docs/DEPLOY.md.
# =============================================================================

services:
  app:
    image: ghcr.io/wannaco/gw-mailbox:latest
    # MANDATORY. Compose defaults to pull_policy: missing, which only pulls when
    # the image is absent locally. With a moving tag like :latest that means a
    # `docker compose up -d` reports success in ~1s while the old container keeps
    # running — silent no-op upgrades. Do not remove this line.
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Falls back to the Caddy domain so a minimal .env still works.
      MAILBOX_PUBLIC_URL: ${MAILBOX_PUBLIC_URL:-https://${DOMAIN}}
      MAILBOX_SEED_DEMO: ${MAILBOX_SEED_DEMO:-0}
      MAILBOX_TIMEZONE: ${MAILBOX_TIMEZONE:-UTC}
    volumes:
      - pb_data:/app/pb_data
    expose:
      - "8090"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pb_data:
  caddy_data:
  caddy_config:
