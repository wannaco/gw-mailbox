name: build-push

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ghcr.io/wannaco/gw-mailbox

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: amd64 only. The PocketBase binary is committed to the repo and is
      # linux/amd64 (see the Dockerfile's `COPY pocketbase`). Building arm64
      # would ship an amd64 binary inside an arm64 image — it would not run.
      #
      # To add arm64, add a second job that passes
      #   build-args: PB_BINARY_URL=<pocketbase_<ver>_linux_arm64.zip>
      # The Dockerfile already supports this: it fetches and swaps the binary
      # when PB_BINARY_URL is set. build-push-action accepts one build-args
      # value for all platforms, so it has to be one job per architecture
      # rather than a matrix inside a single job.
      #
      # No release tags yet. Adding :0.1.0 / :0.1 means deciding what counts as
      # a release and whether :latest tracks tags or main — do that when there
      # is a release process, not before. The SHA tag below is a real pin in the
      # meantime (`image: ghcr.io/wannaco/gw-mailbox:<sha>`).
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
